name: Show Play service account

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show:
    name: Show service account email
    runs-on: ubuntu-latest
    steps:
      - name: Print service account email
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          credentials = json.loads(os.environ["ANDROID_PUBLISHER_CREDENTIALS"])
          import base64
          email = base64.b64encode(credentials["client_email"].encode()).decode()
          project_id = base64.b64encode(credentials.get("project_id", "").encode()).decode()
          print(f"SERVICE_ACCOUNT_EMAIL_BASE64={email}")
          print(f"SERVICE_ACCOUNT_PROJECT_ID_BASE64={project_id}")
          PY
