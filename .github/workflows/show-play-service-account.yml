name: Show Play service account

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show:
    name: Show service account email
    runs-on: ubuntu-latest
    steps:
      - name: Print service account email
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          credentials = json.loads(os.environ["ANDROID_PUBLISHER_CREDENTIALS"])
          print(f"SERVICE_ACCOUNT_EMAIL={credentials['client_email']}")
          print(f"SERVICE_ACCOUNT_PROJECT_ID={credentials.get('project_id', '')}")
          PY
