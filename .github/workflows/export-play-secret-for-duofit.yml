name: Export Play secret for DuoFit

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: DuoFit repository public key
        required: true
      key_id:
        description: DuoFit repository public key id
        required: true

permissions:
  contents: read

jobs:
  export:
    name: Encrypt publisher credentials
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt secret for DuoFit
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          DUOFIT_PUBLIC_KEY: ${{ inputs.public_key }}
          DUOFIT_KEY_ID: ${{ inputs.key_id }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_PUBLISHER_CREDENTIALS" ]]; then
            echo "::error::ANDROID_PUBLISHER_CREDENTIALS is missing in LoanTracker."
            exit 1
          fi

          python3 -m pip install --quiet pynacl
          python3 - <<'PY'
          import base64
          import os
          from nacl import encoding, public

          public_key = public.PublicKey(
              os.environ["DUOFIT_PUBLIC_KEY"],
              encoding.Base64Encoder(),
          )
          sealed_box = public.SealedBox(public_key)
          encrypted = sealed_box.encrypt(os.environ["ANDROID_PUBLISHER_CREDENTIALS"].encode("utf-8"))

          print(f"DUOFIT_KEY_ID={os.environ['DUOFIT_KEY_ID']}")
          print(f"DUOFIT_ENCRYPTED_VALUE={base64.b64encode(encrypted).decode('ascii')}")
          PY
