name: Upload Android release to Google Play

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-play-internal.yml"
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: google-play-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and upload AAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this push is a new version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version_code="$(
            sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' app/build.gradle.kts | head -n 1
          )"

          if [[ -z "$current_version_code" ]]; then
            echo "Could not read versionCode from app/build.gradle.kts" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run requested; publishing versionCode $current_version_code."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version_code=$current_version_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          previous_version_code=""

          if [[ -n "$before_sha" && "$before_sha" != "0000000000000000000000000000000000000000" ]]; then
            previous_version_code="$(
              git show "$before_sha:app/build.gradle.kts" 2>/dev/null |
                sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' |
                head -n 1 || true
            )"
          fi

          if [[ -n "$previous_version_code" && "$current_version_code" == "$previous_version_code" ]]; then
            echo "versionCode is still $current_version_code; skipping Play upload."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing versionCode $current_version_code (previous: ${previous_version_code:-unknown})."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version_code=$current_version_code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.version.outputs.should_publish == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Validate required secrets
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD \
            ANDROID_PUBLISHER_CREDENTIALS
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured in GitHub repository secrets."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Restore upload keystore
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/upload-key.jks"

      - name: Test release prerequisites
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:verifyGoogleSignInReleaseConfig

      - name: Upload release bundle to Google Play
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/signing/upload-key.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          PLAY_TRACK: ${{ github.event.inputs.track || 'internal' }}
        run: ./gradlew --no-daemon --console=plain :app:publishReleaseBundle
