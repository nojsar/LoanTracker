name: Copy publisher secret

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: Repository receiving the encrypted secret
        required: true
        type: string
      target_public_key:
        description: Target repository Actions secrets public key
        required: true
        type: string
      target_key_id:
        description: Target repository Actions secrets key id
        required: true
        type: string

permissions:
  contents: read

jobs:
  encrypt:
    name: Encrypt publisher credential for target repo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Encrypt publisher credential
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_PUBLIC_KEY: ${{ inputs.target_public_key }}
          TARGET_KEY_ID: ${{ inputs.target_key_id }}
        run: |
          if [ -z "$ANDROID_PUBLISHER_CREDENTIALS" ]; then
            echo "::error::ANDROID_PUBLISHER_CREDENTIALS secret is missing in LoanTracker"
            exit 1
          fi

          python3 -m pip install --quiet pynacl
          python3 - <<'PY'
          import base64
          import os
          from nacl import encoding, public

          public_key = public.PublicKey(os.environ["TARGET_PUBLIC_KEY"], encoding.Base64Encoder())
          sealed_box = public.SealedBox(public_key)
          encrypted = sealed_box.encrypt(os.environ["ANDROID_PUBLISHER_CREDENTIALS"].encode("utf-8"))

          print(f"TARGET_REPO={os.environ['TARGET_REPO']}")
          print(f"TARGET_KEY_ID={os.environ['TARGET_KEY_ID']}")
          print(f"TARGET_ENCRYPTED_VALUE={base64.b64encode(encrypted).decode('ascii')}")
          PY
